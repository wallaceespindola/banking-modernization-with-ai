  <text x="39" y="632" text-anchor="start" font-size="16" font-weight="700" letter-spacing="1.5" fill="#15803d">LAYER 3: APPROVAL (HUMANS AND THE LEGACY ORACLE)</text>
  <rect x="35" y="100" width="320" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" filter="url(#s)"/>
