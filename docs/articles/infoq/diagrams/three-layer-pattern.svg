  <text x="195" y="181" text-anchor="middle" font-size="18" fill="#1d4ed8">COBOL, JCL, copybooks, DDL</text>
  <rect x="415" y="100" width="320" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" filter="url(#s)"/>
  <text x="575" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Parsers</text>
  <text x="575" y="181" text-anchor="middle" font-size="18" fill="#1d4ed8">and static analysis</text>
  <rect x="865" y="100" width="320" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5" filter="url(#s)"/>
  <text x="1025" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Dependency graph</text>
