  <text x="800" y="438" text-anchor="middle" font-size="18" font-style="italic" fill="#d97706">gates trust</text>
  <path d="M1185,450 L1241,450" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1025,220 L1025,386" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1041" y="281" text-anchor="start" font-size="18" font-style="italic" fill="#334155">reproducible facts</text>
  <path d="M1405,510 L1405,676" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="1389" y="571" text-anchor="end" font-size="18" font-style="italic" fill="#334155">proposals with provenance</text>
  <rect x="1245" y="680" width="320" height="120" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" filter="url(#s)"/>
  <text x="1405" y="735" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Domain expert</text>
  <text x="1405" y="761" text-anchor="middle" font-size="18" fill="#15803d">sign-off</text>
  <rect x="865" y="680" width="320" height="120" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" filter="url(#s)"/>
  <text x="1025" y="735" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Characterization tests</text>
  <text x="1025" y="761" text-anchor="middle" font-size="18" fill="#15803d">against legacy outputs</text>
  <rect x="415" y="680" width="320" height="120" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2.5" filter="url(#s)"/>
  <text x="575" y="735" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Reconciliation</text>
  <text x="575" y="761" text-anchor="middle" font-size="18" fill="#15803d">and shadow run</text>
  <rect x="35" y="680" width="320" height="120" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2.5" filter="url(#s)"/>
  <text x="195" y="735" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Rule catalog entry</text>
  <text x="195" y="761" text-anchor="middle" font-size="18" fill="#b45309">status: validated</text>
  <path d="M1245,740 L1189,740" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M865,740 L739,740" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M415,740 L359,740" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
