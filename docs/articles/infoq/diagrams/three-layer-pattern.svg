  <path d="M735,160 L861,160" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="415" y="390" width="320" height="120" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" filter="url(#s)"/>
  <text x="575" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Evaluation set</text>
  <text x="575" y="471" text-anchor="middle" font-size="18" fill="#6d28d9">precision and recall</text>
  <rect x="865" y="390" width="320" height="120" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" filter="url(#s)"/>
  <text x="1025" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Model</text>
