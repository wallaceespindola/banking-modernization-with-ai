  <rect x="1245" y="390" width="320" height="120" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5" filter="url(#s)"/>
  <text x="1405" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Candidate rule</text>
  <text x="1405" y="471" text-anchor="middle" font-size="18" fill="#6d28d9">with file and line</text>
