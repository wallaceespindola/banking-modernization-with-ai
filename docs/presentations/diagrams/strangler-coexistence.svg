  <text x="600.0" y="279.0" text-anchor="middle" font-size="18" fill="#a5b4fc">per capability, instant fallback</text>
  <rect x="40" y="370" width="340" height="110" rx="16" fill="#ecfdf9" stroke="#14b8a6" stroke-width="2.5" filter="url(#s)"/>
  <text x="210.0" y="419.0" text-anchor="middle" font-size="23" font-weight="700" fill="#0b3b36">New domain service</text>
  <text x="210.0" y="449.0" text-anchor="middle" font-size="18" fill="#0f766e">modern model</text>
  <rect x="820" y="370" width="340" height="110" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5" filter="url(#s)"/>
  <text x="990.0" y="419.0" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">Anti-corruption layer</text>
  <text x="990.0" y="449.0" text-anchor="middle" font-size="18" fill="#b45309">translates legacy codes</text>
