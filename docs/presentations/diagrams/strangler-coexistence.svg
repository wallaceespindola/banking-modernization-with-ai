  <text x="990.0" y="759.0" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">DB2 / VSAM</text>
  <text x="990.0" y="789.0" text-anchor="middle" font-size="18" fill="#b45309">system of record</text>
