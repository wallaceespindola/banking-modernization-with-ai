<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source for three-layer-pattern.png/.jpg: rsvg-convert -z 2 -b white three-layer-pattern.svg -o three-layer-pattern.png -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1600" height="830" fill="#ffffff"/>
  <rect x="15" y="20" width="1570" height="220" rx="20" fill="#f5f9ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="39" y="52" text-anchor="start" font-size="16" font-weight="700" letter-spacing="1.5" fill="#1d4ed8">LAYER 1: FACTS (DETERMINISTIC TOOLING)</text>
