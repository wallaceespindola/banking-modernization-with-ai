  <text x="210.0" y="589.0" text-anchor="middle" font-size="23" font-weight="700" fill="#0b3b36">Service database</text>
  <text x="210.0" y="619.0" text-anchor="middle" font-size="18" fill="#0f766e">owned by the service</text>
  <rect x="430" y="540" width="340" height="110" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#s)"/>
  <text x="600.0" y="589.0" text-anchor="middle" font-size="23" font-weight="700" fill="#172554">Event streaming</text>
  <text x="600.0" y="619.0" text-anchor="middle" font-size="18" fill="#1d4ed8">CDC, one writer per element</text>
  <rect x="820" y="540" width="340" height="110" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5" filter="url(#s)"/>
  <text x="990.0" y="589.0" text-anchor="middle" font-size="23" font-weight="700" fill="#7c2d12">Mainframe</text>
  <text x="990.0" y="619.0" text-anchor="middle" font-size="18" fill="#b45309">CICS and batch</text>
